syntax = "proto3";
package v1;

option go_package = "github.com/patrickmcm/finance-tracker-backend/api/v1";

import "google/protobuf/timestamp.proto";
import "v1/numeric.proto";

message InstrumentPrice {
  string ticker = 1;
  google.protobuf.Timestamp timestamp = 2;
  Numeric open = 3;
  Numeric close = 4;
  Numeric high = 5;
  Numeric low = 6;
  int32 volume = 7;
}