syntax = "proto3";
package v1;

option go_package = "github.com/patrickmcm/finance-tracker-backend/api/v1";

import "v1/get_instrument_request.proto";
import "v1/list_instrument_request.proto";
import "v1/instrument.proto";
import "v1/instrument_collection.proto";

service InstrumentsService {
  rpc Get(GetInstrumentRequest) returns (Instrument);
  rpc List(ListInstrumentRequest) returns (InstrumentCollection);
}